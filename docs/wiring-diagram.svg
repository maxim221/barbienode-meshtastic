<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #17212b; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 21px; fill: #475569; }
      .h2 { font-size: 27px; font-weight: 700; }
      .pin { font-size: 17px; font-weight: 700; }
      .small { font-size: 15px; }
      .row { font-size: 19px; font-weight: 600; }
      .note { font-size: 18px; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1800" height="1220" fill="#f5f7fa"/>
  <text x="70" y="60" class="title">Монтаж ESP32-S3 ↔ E22-900M22S (SX1262)</text>
  <text x="70" y="95" class="subtitle">Ориентация как на фотографиях: антенна ESP32 сверху, USB снизу; надпись E22 читается, IPEX справа снизу.</text>

  <!-- ESP32 board -->
  <g>
    <rect x="55" y="140" width="405" height="840" rx="22" fill="#dbe6ef" stroke="#0f172a" stroke-width="4"/>
    <rect x="145" y="155" width="225" height="145" rx="5" fill="#283947" stroke="#94a3b8" stroke-width="3"/>
    <rect x="165" y="155" width="185" height="45" fill="#111827"/>
    <text x="257" y="225" text-anchor="middle" fill="#e2e8f0" style="font-size:22px;font-weight:700">ESP32-S3</text>
    <text x="257" y="252" text-anchor="middle" fill="#cbd5e1" style="font-size:16px">WROOM-1 N16R8</text>
    <text x="257" y="178" text-anchor="middle" style="font-size:14px;fill:#f8fafc">АНТЕННА — НЕ ЗАКРЫВАТЬ</text>
    <rect x="128" y="902" width="112" height="63" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="275" y="902" width="112" height="63" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <text x="184" y="939" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#17212b">UART</text>
    <text x="184" y="957" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#17212b">прошивка</text>
    <text x="331" y="939" text-anchor="middle" style="font-size:14px;fill:#17212b">Native USB</text>
    <text x="257" y="1018" text-anchor="middle" class="h2">ESP32-S3 DevKit</text>
  </g>

  <!-- ESP left header: only pins relevant plus context -->
  <g>
    <text x="68" y="132" class="small" fill="#475569">ЛЕВАЯ ГРЕБЁНКА</text>
    <!-- helper function rendered manually -->
    <g fill="#d8dee6" stroke="#94a3b8" stroke-width="2">
      <circle cx="76" cy="325" r="10"/><circle cx="76" cy="363" r="10"/><circle cx="76" cy="401" r="10"/><circle cx="76" cy="439" r="10"/>
      <circle cx="76" cy="477" r="10"/><circle cx="76" cy="515" r="10"/><circle cx="76" cy="553" r="10"/><circle cx="76" cy="591" r="10"/>
      <circle cx="76" cy="629" r="10"/><circle cx="76" cy="667" r="10"/><circle cx="76" cy="705" r="10"/><circle cx="76" cy="743" r="10"/>
      <circle cx="76" cy="781" r="10"/><circle cx="76" cy="819" r="10"/><circle cx="76" cy="857" r="10"/><circle cx="76" cy="895" r="10"/>
    </g>
    <!-- selected pin highlights -->
    <g stroke="#fff" stroke-width="2">
      <circle cx="76" cy="325" r="12" fill="#f59e0b"/><circle cx="76" cy="363" r="12" fill="#f59e0b"/>
      <circle cx="76" cy="401" r="12" fill="#f59e0b"/><circle cx="76" cy="439" r="12" fill="#f59e0b"/>
      <circle cx="76" cy="629" r="12" fill="#2563eb"/><circle cx="76" cy="667" r="12" fill="#2563eb"/>
      <circle cx="76" cy="705" r="12" fill="#2563eb"/><circle cx="76" cy="743" r="12" fill="#2563eb"/>
      <circle cx="76" cy="781" r="12" fill="#f59e0b"/><circle cx="76" cy="857" r="12" fill="#dc2626"/>
      <circle cx="76" cy="895" r="12" fill="#111827"/>
    </g>
    <g class="pin" fill="#f8fafc">
      <text x="103" y="331" fill="#f8fafc">GPIO 4 — BUSY</text>
      <text x="103" y="369" fill="#f8fafc">GPIO 5 — NRST</text>
      <text x="103" y="407" fill="#f8fafc">GPIO 6 — RXEN</text>
      <text x="103" y="445" fill="#f8fafc">GPIO 7 — TXEN</text>
      <text x="103" y="483" fill="#94a3b8">GPIO 15</text>
      <text x="103" y="521" fill="#94a3b8">GPIO 16</text>
      <text x="103" y="559" fill="#94a3b8">GPIO 17</text>
      <text x="103" y="597" fill="#94a3b8">… 8, 3, 46, 9</text>
      <text x="103" y="635" fill="#f8fafc">GPIO 10 — NSS</text>
      <text x="103" y="673" fill="#f8fafc">GPIO 11 — MOSI</text>
      <text x="103" y="711" fill="#f8fafc">GPIO 12 — SCK</text>
      <text x="103" y="749" fill="#f8fafc">GPIO 13 — MISO</text>
      <text x="103" y="787" fill="#f8fafc">GPIO 14 — DIO1</text>
      <text x="103" y="825" fill="#94a3b8">резерв</text>
      <text x="103" y="863" fill="#f8fafc">5Vin → AMS1117 IN</text>
      <text x="103" y="901" fill="#f8fafc">GND — общий</text>
    </g>
  </g>

  <!-- E22 module -->
  <g>
    <rect x="1040" y="155" width="690" height="485" rx="8" fill="#17844a" stroke="#0f5132" stroke-width="5"/>
    <rect x="1080" y="205" width="540" height="350" rx="8" fill="#6b7379" stroke="#30373d" stroke-width="4"/>
    <text x="1110" y="250" fill="#fff" style="font-size:20px;font-weight:600">SPI SMD LoRa Module</text>
    <text x="1110" y="310" fill="#fff" style="font-size:40px;font-weight:700">E22-900M22S</text>
    <text x="1110" y="355" fill="#e5e7eb" style="font-size:23px">SX1262 · 850–930 MHz · 22 dBm</text>
    <rect x="1585" y="505" width="102" height="102" rx="8" fill="#111827"/>
    <circle cx="1636" cy="556" r="33" fill="#d4a72c" stroke="#fef3c7" stroke-width="6"/>
    <circle cx="1636" cy="556" r="11" fill="#111827"/>
    <text x="1636" y="493" text-anchor="middle" fill="#fff" style="font-size:17px;font-weight:700">IPEX</text>
  </g>

  <!-- E22 pads and labels, top row left-to-right 11..1 -->
  <g>
    <text x="1040" y="132" class="small">ВЕРХНИЙ РЯД: слева направо 11 → 1</text>
    <g stroke="#7c5a00" stroke-width="2">
      <rect x="1060" y="140" width="42" height="35" fill="#111827"/><rect x="1118" y="140" width="42" height="35" fill="#111827"/>
      <rect x="1176" y="140" width="42" height="35" fill="#dc2626"/><rect x="1234" y="140" width="42" height="35" fill="#94a3b8"/>
      <rect x="1292" y="140" width="42" height="35" fill="#f59e0b"/><rect x="1350" y="140" width="42" height="35" fill="#f59e0b"/>
      <rect x="1408" y="140" width="42" height="35" fill="#111827"/><rect x="1466" y="140" width="42" height="35" fill="#111827"/>
      <rect x="1524" y="140" width="42" height="35" fill="#111827"/><rect x="1582" y="140" width="42" height="35" fill="#111827"/>
      <rect x="1640" y="140" width="42" height="35" fill="#111827"/>
    </g>
    <g class="small" text-anchor="middle">
      <text x="1081" y="118">11 GND</text><text x="1139" y="118">10 GND</text><text x="1197" y="118" fill="#dc2626">9 VCC</text>
      <text x="1255" y="118">8 DIO2</text><text x="1313" y="118" fill="#b45309">7 TXEN</text><text x="1371" y="118" fill="#b45309">6 RXEN</text>
      <text x="1429" y="118">5 GND</text><text x="1487" y="118">4 GND</text><text x="1545" y="118">3 GND</text>
      <text x="1603" y="118">2 GND</text><text x="1661" y="118">1 GND</text>
    </g>
  </g>

  <!-- E22 pads and labels, bottom row 12..22 -->
  <g>
    <g stroke="#7c5a00" stroke-width="2">
      <rect x="1060" y="620" width="42" height="35" fill="#111827"/><rect x="1118" y="620" width="42" height="35" fill="#f59e0b"/>
      <rect x="1176" y="620" width="42" height="35" fill="#f59e0b"/><rect x="1234" y="620" width="42" height="35" fill="#f59e0b"/>
      <rect x="1292" y="620" width="42" height="35" fill="#2563eb"/><rect x="1350" y="620" width="42" height="35" fill="#2563eb"/>
      <rect x="1408" y="620" width="42" height="35" fill="#2563eb"/><rect x="1466" y="620" width="42" height="35" fill="#2563eb"/>
      <rect x="1524" y="620" width="42" height="35" fill="#111827"/><rect x="1582" y="620" width="42" height="35" fill="#94a3b8"/>
      <rect x="1640" y="620" width="42" height="35" fill="#111827"/>
    </g>
    <g class="small" text-anchor="middle">
      <text x="1081" y="682">12</text><text x="1081" y="701">GND</text>
      <text x="1139" y="682" fill="#b45309">13</text><text x="1139" y="701" fill="#b45309">DIO1</text>
      <text x="1197" y="682" fill="#b45309">14</text><text x="1197" y="701" fill="#b45309">BUSY</text>
      <text x="1255" y="682" fill="#b45309">15</text><text x="1255" y="701" fill="#b45309">NRST</text>
      <text x="1313" y="682" fill="#1d4ed8">16</text><text x="1313" y="701" fill="#1d4ed8">MISO</text>
      <text x="1371" y="682" fill="#1d4ed8">17</text><text x="1371" y="701" fill="#1d4ed8">MOSI</text>
      <text x="1429" y="682" fill="#1d4ed8">18</text><text x="1429" y="701" fill="#1d4ed8">SCK</text>
      <text x="1487" y="682" fill="#1d4ed8">19</text><text x="1487" y="701" fill="#1d4ed8">NSS</text>
      <text x="1545" y="682">20</text><text x="1545" y="701">GND</text>
      <text x="1603" y="682">21</text><text x="1603" y="701">ANT NC</text>
      <text x="1661" y="682">22</text><text x="1661" y="701">GND</text>
    </g>
  </g>

  <!-- Wiring map -->
  <g>
    <rect x="500" y="170" width="500" height="695" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="750" y="215" text-anchor="middle" class="h2">Соединить проводами</text>
    <line x1="530" y1="235" x2="970" y2="235" stroke="#e2e8f0" stroke-width="2"/>

    <g class="row">
      <circle cx="540" cy="272" r="9" fill="#f59e0b"/><text x="562" y="280">ESP GPIO 4</text><text x="720" y="280">→ BUSY →</text><text x="850" y="280">E22 pin 14</text>
      <circle cx="540" cy="326" r="9" fill="#f59e0b"/><text x="562" y="334">ESP GPIO 5</text><text x="720" y="334">→ NRST →</text><text x="850" y="334">E22 pin 15</text>
      <circle cx="540" cy="380" r="9" fill="#f59e0b"/><text x="562" y="388">ESP GPIO 6</text><text x="720" y="388">→ RXEN →</text><text x="850" y="388">E22 pin 6</text>
      <circle cx="540" cy="434" r="9" fill="#f59e0b"/><text x="562" y="442">ESP GPIO 7</text><text x="720" y="442">→ TXEN →</text><text x="850" y="442">E22 pin 7</text>
      <circle cx="540" cy="488" r="9" fill="#2563eb"/><text x="562" y="496">ESP GPIO 10</text><text x="720" y="496">→ NSS/CS →</text><text x="850" y="496">E22 pin 19</text>
      <circle cx="540" cy="542" r="9" fill="#2563eb"/><text x="562" y="550">ESP GPIO 11</text><text x="720" y="550">→ MOSI →</text><text x="850" y="550">E22 pin 17</text>
      <circle cx="540" cy="596" r="9" fill="#2563eb"/><text x="562" y="604">ESP GPIO 12</text><text x="720" y="604">→ SCK →</text><text x="850" y="604">E22 pin 18</text>
      <circle cx="540" cy="650" r="9" fill="#2563eb"/><text x="562" y="658">ESP GPIO 13</text><text x="720" y="658">→ MISO →</text><text x="850" y="658">E22 pin 16</text>
      <circle cx="540" cy="704" r="9" fill="#f59e0b"/><text x="562" y="712">ESP GPIO 14</text><text x="720" y="712">→ DIO1 →</text><text x="850" y="712">E22 pin 13</text>
      <circle cx="540" cy="758" r="9" fill="#111827"/><text x="562" y="766">ESP GND</text><text x="720" y="766">→ GND →</text><text x="850" y="766">E22 10/11/12</text>
      <circle cx="540" cy="812" r="9" fill="#94a3b8"/><text x="562" y="820">Не паять</text><text x="720" y="820">DIO2 / ANT</text><text x="850" y="820">pins 8 / 21</text>
    </g>
  </g>

  <!-- Power block -->
  <g>
    <rect x="520" y="905" width="1210" height="225" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="550" y="948" class="h2">Питание E22 — отдельная линия 3,3 В</text>
    <rect x="560" y="985" width="190" height="75" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="655" y="1018" text-anchor="middle" class="row">ESP 5Vin</text>
    <text x="655" y="1047" text-anchor="middle" class="small">только при USB-питании</text>
    <line x1="750" y1="1022" x2="850" y2="1022" stroke="#dc2626" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="860" y="978" width="240" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="980" y="1015" text-anchor="middle" class="row">AMS1117-3.3</text>
    <text x="980" y="1046" text-anchor="middle" class="small">до E22 проверить 3,25–3,35 В</text>
    <line x1="1100" y1="1022" x2="1215" y2="1022" stroke="#dc2626" stroke-width="7" marker-end="url(#arrow)"/>
    <rect x="1225" y="978" width="240" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="1345" y="1015" text-anchor="middle" class="row">E22 pin 9 VCC</text>
    <text x="1345" y="1046" text-anchor="middle" class="small">100 нФ + 10 мкФ рядом</text>
    <text x="1510" y="1008" class="note">+ 220–470 мкФ</text>
    <text x="1510" y="1038" class="note">между VCC и GND</text>
    <text x="550" y="1105" class="note">Все земли объединить. Антенну IPEX защёлкнуть при снятом питании. Не подавать 5 В на E22.</text>
  </g>

  <rect x="55" y="1158" width="1675" height="42" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
  <text x="892" y="1186" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#9f1239">Перед включением прозвонить GND и проверить напряжение на E22 pin 9. Передавать без антенны нельзя.</text>
</svg>
