[BarbieNode_E22_S3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = variants/barbienode_e22_s3/tripleboot_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
  ${esp32_base.build_flags}
  -UENABLE_ADVERT_ON_BOOT
  -I variants/barbienode_e22_s3
  -D BARBIENODE_E22_S3
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=10
  -D P_LORA_RESET=5
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=12
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=11
  -D SX126X_RXEN=6
  -D SX126X_TXEN=7
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D MAX_LORA_TX_POWER=22
  -D LORA_FREQ=868.731
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=7
  -D PIN_USER_BTN=0
  -D DISABLE_WIFI_OTA
  -D BARBIENODE_TCP_ALLOWED_IP='"192.168.1.19"'
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/barbienode_e22_s3>
lib_deps =
  ${esp32_base.lib_deps}

[env:BarbieNode_E22_S3_companion_radio_ble]
extends = BarbieNode_E22_S3
build_flags =
  ${BarbieNode_E22_S3.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${BarbieNode_E22_S3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${BarbieNode_E22_S3.lib_deps}
  densaugeo/base64 @ ~1.4.0
